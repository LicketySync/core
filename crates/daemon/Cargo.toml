[package]
name = "licketysync-daemon"
description = "The service: folders, the local API over a Unix socket or named pipe and localhost HTTP, settings with Apply and Discard, issues and peer status."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# rusqlite 0.41's, above the workspace's 1.88.
rust-version = "1.89"
publish = false

[dependencies]
# The runtime's Storage trait, which the store implements.
licketysync-engine = { path = "../engine" }
# The store's disk format: SQLite, as the plan names it, compiled from the copy
# libsqlite3-sys bundles, so every platform runs the one version the lockfile
# pins rather than whatever the system has. The statement cache, nothing else.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache"] }

[target.'cfg(unix)'.dependencies]
# The store's files opened without following a link or blocking on a FIFO
# (O_NOFOLLOW, O_NONBLOCK), and the effective user they must belong to:
# std offers neither flag by name, nor geteuid. Already beneath async-io.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
# The storage conformance suite (runtime::conformance).
licketysync-engine = { path = "../engine", features = ["testkit"] }
# commit_hook, to make a commit fail in tests as a full disk does.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache", "hooks"] }
# The model test of the store (plan: Tests).
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
