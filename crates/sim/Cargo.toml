[package]
name = "licketysync-sim"
description = "Deterministic simulator: many peers in one process over a simulated clock and network, seeded, with fault injection. Its gate scenarios check that simulated peers converge."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
licketysync-engine = { path = "../engine" }
# The engine scenarios' fixed device seeds and folder keys, and the oracle's
# check that each stored blob matches its ciphertext hash (keys.md 3.2).
licketysync-keys = { path = "../keys" }
# The section 5 rows the engine counts, which the watermark scenarios read.
licketysync-protocol = { path = "../protocol" }

[dev-dependencies]
# The storage conformance suite (runtime::conformance), run on SimStorage.
licketysync-engine = { path = "../engine", features = ["testkit"] }
# The suite's model test (plan: Tests).
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
