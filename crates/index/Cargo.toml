[package]
name = "licketysync-index"
description = "The per-folder index: the latest versions of each path by version vectors and names, tree deletes, cleanups, expiry by the folder's own time, set digests and serving, and transactions undone exactly; in memory behind a storage trait until SQLite lands in phase 1."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Record hashes, set digests, path tags, folder keys and identifiers (keys.md
# 3 to 5): every hash, key and signature check is the keys crate's; this crate
# computes none.
licketysync-keys = { path = "../keys" }
# The wire forms and checks of the records and of the exchange (protocol.md
# 4.4, 4.5): Record (steps 1 and 7), the drafts a writer signs, prefixes and
# the reconcile outcome, the pager. This crate holds the records those checks
# are about.
licketysync-protocol = { path = "../protocol" }

[dev-dependencies]
# The property tests (a) to (k) of protocol.md 8 item 7 (plan: Tests).
proptest = { version = "1", default-features = false, features = ["std"] }
# The test vectors of protocol.md 8 items 6, 7, 8 and 12 are JSON data files,
# as the keys and protocol crates' are.
serde_json = "1"
hex = "0.4"
# Hand-built record bodies, so that tests reach the writer faults a writer's
# draft refuses to sign.
prost = "0.14"

[lints]
workspace = true
