[package]
name = "licketysync-keys"
description = "Shared folder keys: the write secret and its derivations, read and sealed keys, Ed25519-signed records, chunk and metadata encryption, handshake proofs, key strings and words."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake3 = { version = "1.8", features = ["zeroize"] }
ed25519-dalek = "3"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "3", default-features = false, features = ["zeroize"] }
bech32 = "0.12"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
prost = "0.14"
base64 = { version = "0.23", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
hex = "0.4"

[lints]
workspace = true
