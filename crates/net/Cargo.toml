[package]
name = "licketysync-net"
description = "Networking on rust-libp2p: QUIC and TCP with TLS 1.3, the device's libp2p identity, connection limits and the /licketysync/sync/1 byte stream."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
licketysync-keys = { path = "../keys" }
licketysync-protocol = { path = "../protocol" }
licketysync-engine = { path = "../engine" }
libp2p-core = "0.44.0"
libp2p-identity = { version = "0.3.1", features = ["ed25519", "peerid"] }
libp2p-swarm = { version = "0.48.0", features = ["macros", "tokio"] }
libp2p-tcp = { version = "0.45.0", features = ["tokio"] }
libp2p-quic = { version = "0.14.0", features = ["tokio"] }
libp2p-tls = "0.7.0"
libp2p-yamux = "0.48.0"
libp2p-connection-limits = "0.7.0"
libp2p-memory-connection-limits = "0.6.0"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std"] }
futures = "0.3.34"
# Not called: it holds idna (beneath url, beneath multiaddr) on idna_adapter's
# 1.0 line, the ASCII-only back end, an exception to the stay-current rule
# that the owner approved on 2026-11-03 ("Keep 1.0.0. Record this decision as
# an exception to the rule, but we would upgrade to 1.0.* if that ever
# appears."). `~1.0` takes any 1.0.* release as usual; deny.toml bans the
# ICU4X back end that 1.1 and later bring, and dependabot.yml skips them.
idna_adapter = "~1.0"

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "time", "net"] }
multistream-select = "0.14.0"
memory-stats = "1.2.0"
serde_json = "1"
hex = "0.4"

# The example's address parser has tests of its own, run with the crate's.
[[example]]
name = "spike"
test = true

[lints]
workspace = true
