[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/licketysync/core"
rust-version = "1.88"

# One lint policy for every crate. The Engineering practice section of the plan
# is the source of truth; these are the mechanical parts of it.
[workspace.lints.rust]
unsafe_code = "forbid"          # platform-FFI crates, when they exist, opt out explicitly
dead_code = "deny"
unused = { level = "deny", priority = -1 }
unreachable_pub = "warn"
missing_docs = "warn"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"            # no unwrap or expect outside tests
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"       # a slice index on untrusted lengths is a panic waiting
todo = "deny"                   # a TODO without an issue link is not allowed to compile
dbg_macro = "deny"
print_stdout = "warn"           # the CLI crate allows it locally
print_stderr = "warn"

# Every package that is not a workspace member, in dev and test builds: the
# dependencies (the cryptography above all), and also the proc-macros and
# build scripts the build runs and their own dependencies, since this override
# outranks [profile.dev.build-override]. Optimized: the phase 0 gate
# (crates/engine/tests/converge.rs) took 389 s of wall time and 41 CPU-minutes
# without it, 185 s and 21 with it. Debug info as line tables only, which
# backtraces need for file and line: the cold test build took 266 s instead of
# 274, and its target directory holds 5.3 GB instead of 6.2.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# The workspace's own crates in test builds (nextest, the coverage loop,
# doc-tests, cargo-mutants, cargo-careful) at opt-level 1, with dev's debug
# assertions and overflow checks; dev builds stay at 0. The gate's nextest
# step took 28 s instead of 224 and its coverage loop 141 s instead of 283, and
# every file's coverage stayed the same.
[profile.test]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
