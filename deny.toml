# cargo-deny policy. `cargo deny check` runs on every push.

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MPL-2.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates inside this workspace depend on each other by path alone; cargo-deny
# counts a path dependency without a version as a wildcard. This exemption
# applies only to path dependencies of crates marked `publish = false`, which
# all of ours are.
allow-wildcard-paths = true
highlight = "all"
# Cryptography comes only from the approved list in the plan's Security section.
deny = [
  { crate = "openssl", reason = "rustls on aws-lc-rs is the TLS stack" },
  { crate = "openssl-sys", reason = "rustls on aws-lc-rs is the TLS stack" },
  { crate = "md5", reason = "not an approved primitive" },
  { crate = "sha1", reason = "not an approved primitive" },
  { crate = "rust-crypto", reason = "unmaintained" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
