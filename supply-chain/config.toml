
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.aead]]
version = "0.6.1"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): AEAD traits beneath chacha20poly1305 (deny.toml wrapper); RustCrypto. Not covered by the imported audits at this version."

[[exemptions.anyhow]]
version = "1.0.104"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): build-time only, a dependency of prost-derive's proc macro; dtolnay, whom the Mozilla, ISRG and Bytecode Alliance sets trust. Not covered by the imported audits at this version."

[[exemptions.arrayvec]]
version = "0.7.8"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): stack vectors beneath blake3 and bip39's hashes; bluss, widely used. Not covered by the imported audits at this version."

[[exemptions.autocfg]]
version = "1.5.1"
criteria = "safe-to-run"
notes = "Phase 0 exemption (licketysync-keys): build-time only, num-traits' build script beneath proptest (dev-only since the keys-crate rework removed module-lattice); cuviper. Not covered by the imported audits at this version."

[[exemptions.base64]]
version = "0.23.1"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): base64url of the certificate hash in join links (keys.md 6.3), built with default features off and alloc only, so the simd-unsafe feature's code is not compiled; marshallpierce; 0.22.1 was covered by the Google import (Dependabot review of 2026-10-18). Not covered by the imported audits at this version."

[[exemptions.bech32]]
version = "0.12.0"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): the approved key-string encoding (suites.md 3.2), Bech32m only and never its error-correction API; rust-bitcoin; 0.12.0 reviewed in the Dependabot review of 2026-10-18 (the key-string vectors are byte-identical to 0.11.1's). Not covered by the imported audits at this version."

[[exemptions.bip39]]
version = "3.0.0"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): the approved encoding of the write key's words (suites.md 3.2), English only, zeroize feature, no seed function; rust-bitcoin; the Trezor vectors pass here. Not covered by the imported audits at this version."

[[exemptions.bitcoin_hashes]]
version = "0.14.101"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): SHA-256 for the BIP39 checksum inside bip39 only (deny.toml wrapper); rust-bitcoin. Not covered by the imported audits at this version."

[[exemptions.bitflags]]
version = "2.13.2"
criteria = "safe-to-run"
notes = "Phase 0 exemption (licketysync-keys): dev-only via proptest; KodrAus. Not covered by the imported audits at this version."

[[exemptions.blake3]]
version = "1.8.7"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): the approved hash (suites.md 3.1), called only from licketysync-keys' labels module; the BLAKE3 team's reference implementation; the official vectors pass here. Not covered by the imported audits at this version."

[[exemptions.block-buffer]]
version = "0.12.1"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): block buffering beneath the RustCrypto hashes; RustCrypto. Not covered by the imported audits at this version."

[[exemptions.bytes]]
version = "1.12.1"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): prost's buffer type; tokio-rs (Darksonn), whom the Mozilla and Bytecode Alliance sets trust. Not covered by the imported audits at this version."

[[exemptions.cc]]
version = "1.8.0"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): build-time only, blake3's build script; rust-lang. Not covered by the imported audits at this version."

[[exemptions.cfg-if]]
