# The bans that hold for the shipped dependency graph only (dev-dependencies
# excluded): where a test tool depends on a cryptography crate, deny.toml
# allows it and this file does not. `gate.sh` and CI run
# `cargo deny --config deny-production.toml check bans` after `cargo deny check`.

[graph]
all-features = true
exclude-dev = true

[bans]
# deny.toml reports duplicate versions; this file only enforces wrappers.
multiple-versions = "allow"
wildcards = "deny"
# As in deny.toml: workspace crates depend on each other by path alone, and
# every one of them is `publish = false`.
allow-wildcard-paths = true
deny = [
  { crate = "chacha20", wrappers = ["chacha20poly1305", "rand"], reason = "never without the MAC, except as rand's generator" },
  # rand in a shipped build only beneath the transport crates (suites.md 3.1
  # and 3.2): deny.toml's wrappers without proptest.
  { crate = "rand", wrappers = ["libp2p-core", "libp2p-quic", "libp2p-swarm", "quinn-proto"], reason = "first-party randomness is getrandom (suites.md 4.3); rand only beneath the libp2p crates and quinn" },
  # Reached only through proptest, a dev-dependency, so no shipped build has
  # it (deny.toml's entry).
  { crate = "rand_xorshift", reason = "proptest's test generator; never in a shipped build" },
]
