[package]
name = "licketysync-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Not a member of the core workspace: cargo-fuzz builds it on its own.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
licketysync-keys = { path = "../crates/keys" }
licketysync-protocol = { path = "../crates/protocol" }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

