# Project Semgrep rules written from the plan's hardening review. Add one rule
# per class of bug the review named; keep them few and precise. The cases each
# rule must and must not flag are in .semgrep/tests/project.rs (`// ruleid:` on
# the line before a line that must match, `// ok:` before one that must not);
# ci/semgrep-scan.sh (gate.sh and CI) runs them with `semgrep --test` before
# the scan, and the scan excludes that file so that its cases are not reported
# as findings. `semgrep --test` fails when a rule the file names has no finding
# in it, so every rule needs at least one `ruleid` case there; it ignores
# `paths`, so ci/test-semgrep-scan.sh tests those on a made-up tree.
rules:
  # A tripwire, not the control: deny.toml lets only licketysync-keys depend on
  # blake3 (suites.md, hashing). Inside it, only the labels module calls it; that
  # file is excluded by path, as are the crates' integration tests and
  # out-of-line test modules. The protocol crate is scanned too, where no call
  # may appear at all.
  # `.semgrep/tests/**` is included so that the cases apply whether or not
  # `semgrep --test` honours `paths`.
  - id: blake3-only-in-hash-modules
    languages: [rust]
    severity: ERROR
    message: >-
      BLAKE3 is called only from crates/keys/src/labels.rs (suites.md, hashing;
      TM-14). A hash, keyed hash,
      key derivation or Hasher built anywhere else is one no label or key
      registry governs, which can equal a hash of another kind and, over plaintext
      chunks, is a fingerprint anyone can test (hardening review:
      confirmation-of-a-file). Call the helpers in that module.
    paths:
      include: ["crates/keys/**", "crates/protocol/**", ".semgrep/tests/**"]
      exclude:
        - "crates/keys/src/labels.rs"
        - "crates/keys/tests/**"
        - "crates/protocol/tests/**"
        - "tests.rs"
    patterns:
      - pattern-either:
          - pattern: blake3::hash($X)
          - pattern: blake3::keyed_hash($K, $X)
          - pattern: blake3::derive_key($C, $X)
          - pattern: blake3::Hasher::new()
          - pattern: blake3::Hasher::default()
          - pattern: blake3::Hasher::new_keyed($K)
          - pattern: blake3::Hasher::new_derive_key($C)
      - pattern-not-inside: |
          mod tests { ... }
  # Semgrep does not resolve Rust paths, so an imported or aliased blake3 would
  # hide calls from the rule above; in these crates the crate is named in full.
  - id: no-blake3-imports
    languages: [rust]
    severity: ERROR
    message: >-
      Name blake3 by its full path (blake3::...) in the keys and protocol crates,
      never through a use or extern crate item, so that blake3-only-in-hash-modules
      sees every call (suites.md, hashing).
    paths:
      include: ["crates/keys/**", "crates/protocol/**", ".semgrep/tests/**"]
      exclude:
        - "crates/keys/src/labels.rs"
        - "crates/keys/tests/**"
        - "crates/protocol/tests/**"
        - "tests.rs"
    patterns:
      - pattern-regex: '(?m)^[ \t]*(?:pub(?:\([^)]*\))?[ \t]+)?(?:use|extern[ \t]+crate)[ \t]+[^;]*\bblake3\b'
      - pattern-not-inside: |
          mod tests { ... }
  # TM-4: canonicalize and read_link follow symlinks, in std::fs's free
  # functions and in Path's methods (PathBuf derefs to Path) alike, called as a
  # method or by path, or passed as a function value: the bare paths match both.
  # symlink_metadata does not follow; the resolver uses it.
  - id: no-follow-symlinks
    languages: [rust]
    severity: ERROR
    message: >-
      Paths from peers or the index go through the beneath-root resolver; never
      canonicalize or open them directly (Syncthing 2016 traversal, CVE-2017-1000420).
    pattern-either:
      - pattern: std::fs::canonicalize
      - pattern: std::fs::read_link
      - pattern: std::path::Path::canonicalize
      - pattern: std::path::Path::read_link
      - pattern: std::path::PathBuf::canonicalize
      - pattern: std::path::PathBuf::read_link
      - pattern: $P.canonicalize()
      - pattern: $P.read_link()
  # TM-4: the resolver (crates/fs/src/resolver.rs and crates/fs/src/resolver/)
  # is the one way to the disk, so in fs and engine nothing else reaches it by
  # a path. Flagged, called or passed as a value, a raw identifier (r#read)
  # and a turbofish (read::<P>) included:
  # - every function of std::fs, std::os::unix::fs, std::os::windows::fs,
  #   std::os::wasi::fs and rustix::fs;
  # - File::open, create, create_new and options, OpenOptions, DirBuilder and
  #   rustix's Dir, also called as <std::fs::File>::open(...) (a qualified
  #   path is matched only as a call: as a pattern, <T>::$F also matches the
  #   type in Option<T>);
  # - every associated function of std::os::unix::net's types (a bind makes
  #   a file by its path, a connect looks one up), std::process::Command (it
  #   runs a program by its path) and std::env::set_current_dir; every
  #   function of rustix::net (bind_unix) and rustix::process (chdir);
  # - a type alias of File, OpenOptions, DirBuilder, rustix's Dir, Command or
  #   one of std::os::unix::net's types (a path type stays free to alias);
  # - the methods of Path and PathBuf that read the disk (exists, metadata,
  #   read_dir and their kin), as methods or by path. Semgrep matches a method
  #   by its name, not its type, so another type's method of one of those
  #   names (File::metadata, FileType::is_dir) is flagged too, outside the
  #   resolver: name it otherwise or move it there;
  # - a use item, a re-export included, that names std::fs, std::process,
  #   std::os or a module of it but std::os::fd (unix, windows, wasi, and so
  #   their fs and net), rustix::fs, rustix::net or rustix::process, or
  #   renames std (Semgrep does not follow `std as s` into s::fs::read) or
  #   one of os, unix, windows, wasi, fs, net, process and rustix, or takes a
  #   glob of one, or renames one in braces with `self as`; outside the
  #   resolver such a type is named by its full path;
  # - as text, a backstop for what Semgrep does not parse (macro arguments,
  #   such as assert!(std::fs::read(p).is_ok()), and raw identifiers in a
  #   path, such as std::r#fs::read): a path to a function of std::fs,
  #   std::process, std::os::*::fs or ::net, rustix::fs, rustix::net or
  #   rustix::process, or of unix::fs, windows::fs or wasi::fs; File's opening
  #   functions, also as <..::File>::open, a value; OpenOptions, DirBuilder,
  #   process::Command and set_current_dir; std::os::unix::net's types; Path
  #   or PathBuf followed by :: and a function named as above (Path::exists,
  #   also as a value); and a call of a method named as above with no
  #   arguments. Comments and strings too: prose says it otherwise.
  # Path types (std::path::PathBuf) and std::fs::File by its full path stay
  # free to name. What no pattern sees is left to review and to TM-8
  # (threat-model.md TM-4): a macro that builds such a call from parts, a
  # dependency that opens by a path, and std's functions that take a path
  # outside these modules. The rule below keeps the resolver from
  # re-exporting a way in. `.semgrep/tests/**` as in the blake3 rules.
  - id: disk_by_path-only-in-resolver
    languages: [rust]
    severity: ERROR
    message: >-
      In the fs and engine crates only the resolver (crates/fs/src/resolver*)
      reaches the disk, through descriptors and *at calls that never follow a
      symbolic link (TM-4). Resolve the path with Root::parent and use the
      Dir it gives, or add what is missing to the resolver.
    paths:
      include: ["/crates/fs/**", "/crates/engine/**", "/.semgrep/tests/**"]
      exclude: ["/crates/fs/src/resolver.rs", "/crates/fs/src/resolver/**"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: std::fs::$F
              - pattern: std::fs::$F::<$T>
              - pattern: std::fs::$F::<$T, $U>
              - pattern: std::os::unix::fs::$F
              - pattern: std::os::unix::fs::$F::<$T>
              - pattern: std::os::unix::fs::$F::<$T, $U>
              - pattern: std::os::windows::fs::$F
              - pattern: std::os::windows::fs::$F::<$T>
              - pattern: std::os::windows::fs::$F::<$T, $U>
              - pattern: std::os::wasi::fs::$F
              - pattern: std::os::wasi::fs::$F::<$T>
              - pattern: std::os::wasi::fs::$F::<$T, $U>
              - pattern: rustix::fs::$F
              - pattern: rustix::fs::$F::<$T>
              - pattern: rustix::fs::$F::<$T, $U>
          - metavariable-regex:
              metavariable: $F
              regex: ^(r#)?[a-z][a-z0-9_]*$
      - patterns:
          - pattern-either:
              - pattern: std::fs::File::$F
              - pattern: <std::fs::File>::$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(r#)?(open|create|create_new|options|open_buffered|create_buffered)$
      - pattern: std::fs::OpenOptions::$F
      - pattern: <std::fs::OpenOptions>::$F(...)
      - pattern: std::fs::DirBuilder::$F
      - pattern: <std::fs::DirBuilder>::$F(...)
      - pattern: rustix::fs::Dir::$F
      - pattern: <rustix::fs::Dir>::$F(...)
      - pattern: std::os::unix::net::$T::$F
      - pattern: <std::os::unix::net::UnixListener>::$F(...)
      - pattern: <std::os::unix::net::UnixStream>::$F(...)
      - pattern: <std::os::unix::net::UnixDatagram>::$F(...)
      - pattern: <std::os::unix::net::SocketAddr>::$F(...)
      - pattern: std::process::Command::$F
      - pattern: <std::process::Command>::$F(...)
      - pattern: std::env::set_current_dir
      - patterns:
          - pattern-either:
              - pattern: rustix::net::$F
              - pattern: rustix::process::$F
          - metavariable-regex:
              metavariable: $F
              regex: ^(r#)?[a-z][a-z0-9_]*$
      - pattern: type $A = std::fs::File;
      - pattern: type $A = std::fs::OpenOptions;
      - pattern: type $A = std::fs::DirBuilder;
      - pattern: type $A = rustix::fs::Dir;
      - pattern: type $A = std::process::Command;
      - pattern: type $A = std::os::unix::net::UnixListener;
      - pattern: type $A = std::os::unix::net::UnixStream;
      - pattern: type $A = std::os::unix::net::UnixDatagram;
      - pattern: type $A = std::os::unix::net::SocketAddr;
      - patterns:
          - pattern-either:
              - pattern: $P.$M()
              - pattern: std::path::Path::$M
              - pattern: std::path::PathBuf::$M
              - pattern: <std::path::Path>::$M(...)
              - pattern: <std::path::PathBuf>::$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(r#)?(exists|try_exists|is_file|is_dir|is_symlink|metadata|symlink_metadata|read_dir|read_link|canonicalize)$
      - pattern-regex: '(?m)^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s[^;]*?(?:\bstd\s*as\b|\b(?:os|unix|windows|wasi|fs|net|process|rustix)\s*as\b|\b(?:std|os|unix|windows|wasi|fs|net|process|rustix)\s*::\s*\*|\b(?:std|os|unix|windows|wasi|fs|net|process|rustix)\s*::\s*\{[^{};]*(?:\bself\s*as\b|\*))'
      - pattern-regex: '(?m)^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s[^;]*?(?:\b(?:r#)?std\b[^;]*?\b(?:r#)?(?:fs|process)\b|\b(?:r#)?rustix\b[^;]*?\b(?:r#)?(?:fs|net|process)\b)'
      - pattern-regex: '(?m)^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s[^;]*?\b(?:r#)?std\b[^;]*?\b(?:r#)?os\b(?!\s*::\s*(?:r#)?fd\b)'
      - pattern-regex: '\b(?:r#)?std\s*::\s*(?:(?:r#)?os\s*::\s*(?:r#)?\w+\s*::\s*(?:r#)?(?:fs|net)|(?:r#)?(?:fs|process))\s*::\s*(?:r#)?[a-z_]\w*\b|\b(?:r#)?rustix\s*::\s*(?:r#)?(?:fs|net|process)\s*::\s*(?:r#)?[a-z_]\w*\b|\b(?:r#)?(?:unix|windows|wasi)\s*::\s*(?:r#)?fs\s*::\s*(?:r#)?[a-z_]\w*\b'
      - pattern-regex: '\bFile\s*>?\s*::\s*(?:r#)?(?:open|create|create_new|options|open_buffered|create_buffered)\b|\b(?:OpenOptions|DirBuilder|set_current_dir|UnixListener|UnixStream|UnixDatagram)\b|\bprocess\s*::\s*Command\b'
      - pattern-regex: '\b(?:Path|PathBuf)\s*>?\s*::\s*(?:r#)?(?:exists|try_exists|is_file|is_dir|is_symlink|metadata|symlink_metadata|read_dir|read_link|canonicalize)\b'
      - pattern-regex: '\.\s*(?:r#)?(?:exists|try_exists|is_file|is_dir|is_symlink|metadata|symlink_metadata|read_dir|read_link|canonicalize)\s*\(\s*\)'
  # TM-4: the resolver's files re-export nothing but their own types, so that
  # no way to the disk by a path leaves them under another name (pub use
  # std::fs as g; then crate::resolver::g::read). A `pub use` there names one
  # of the resolver's own modules (unix, other, walk, linux), with or without
  # `self::`. `.semgrep/tests/**` as in the blake3 rules.
  - id: resolver_re-exports-only-its-own-types
    languages: [rust]
    severity: ERROR
    message: >-
      The resolver's files re-export only their own modules' items (TM-4): a
      re-export of anything else could hand a way to the disk by a path to
      the code outside, where disk_by_path-only-in-resolver cannot see it.
    paths:
      include: ["/crates/fs/src/resolver.rs", "/crates/fs/src/resolver/**", "/.semgrep/tests/**"]
    pattern-regex: '(?m)^[ \t]*pub(?:\([^)]*\))?\s+use\s+(?!(?:self::)?(?:unix|other|walk|linux)::)'
  - id: no-expect-on-remote-data
    languages: [rust]
    severity: ERROR
    message: No `expect` on anything decoded from a peer (rust-libp2p 2026 QUIC panic).
    pattern: $DECODED.expect(...)
    # `.semgrep/tests/**` as in the blake3 rules: the cases apply whether or not
    # `semgrep --test` honours `paths` (1.181 does not). The crates' integration
    # tests may expect, as all tests may.
    paths:
      include: ["crates/protocol/**", "crates/net/**", ".semgrep/tests/**"]
      exclude: ["/crates/protocol/tests/**", "/crates/net/tests/**"]
  # TM-7: forbid(unsafe_code) does not see what a macro defined in another
  # crate expands into a forbidding crate (rustc reports no lint inside such an
  # expansion), and cargo-geiger counts no macro body. So the words of the
  # constructs the lint forbids are banned as text: unsafe, and no_mangle,
  # export_name, link_section and global_asm, which a crate on edition 2021 or
  # earlier writes without unsafe (global_asm needs none on any edition). In
  # code, macro_rules! bodies, comments and strings alike, which fails
  # closed (prose must say it otherwise; unsafe_code, not_unsafe and other
  # longer words pass). In every file under crates/, whatever its name; in
  # every Rust file elsewhere (.rs in any case, as macOS and Windows read
  # it), since a workspace crate can depend on one by path; and in every other
  # file a build reads: each Cargo.toml, the root's clippy.toml, and the fuzz
  # seeds that tests read with include_bytes!; ci/scope.py spells out the same
  # scope for the scripts, and ci/check-dep-info.sh fails when a build reads
  # any file outside it. ci/semgrep-scan.sh
  # runs the project rules with nosemgrep off and fails when the scan skips a
  # file in their scope. Neither the rule's id nor any comment among its cases
  # holds a banned word whole.
  - id: unsafe_code-only-in-ffi-crates
    languages: [regex]
    severity: ERROR
    message: >-
      The words unsafe, no_mangle, export_name, link_section and global_asm are
      written only in the platform-FFI crates this rule's exclude list names
      (threat-model.md TM-7). forbid(unsafe_code) misses what another crate's
      macro expands into a crate, and cargo-geiger counts no macro body, so the
      words are banned everywhere else, comments and strings included: reword
      the text, or put the code in a platform-FFI crate by a reviewed change to
      that list.
    paths:
      include:
        - "/crates/**"
        - "*.[Rr][Ss]"
        - "[Cc][Aa][Rr][Gg][Oo].[Tt][Oo][Mm][Ll]"
        - "/[Cc][Ll][Ii][Pp][Pp][Yy].[Tt][Oo][Mm][Ll]"
        - "/.[Cc][Ll][Ii][Pp][Pp][Yy].[Tt][Oo][Mm][Ll]"
        - "/fuzz/seeds/**"
        - "/.semgrep/tests/**"
      # The platform-FFI crates, each "/crates/<name>/**", added by a reviewed
      # change. Miri covers them nightly, and none exports a macro. None yet.
      exclude: []
    pattern-regex: '\b(?:unsafe|no_mangle|export_name|link_section|global_asm)\b'
  # TM-7: an extern block links native code: #[link(name = ..., modifiers =
  # "+verbatim")] extern "C" {} runs a library's code before main, from a file
  # in this repository. Edition 2024, which the workspace's crates are on,
  # writes it unsafe extern, which forbid(unsafe_code) refuses, but a macro of
  # a crate on edition 2021 or earlier writes it without unsafe. A macro can
  # take the keyword as a token where it passes (m!(extern fn)) and emit a
  # block with it, so the keyword extern itself is banned in the word rule's
  # scope, extern crate and extern "C" fn included; no workspace crate uses
  # either. A keyword cannot be assembled from tokens, so the ban by spelling
  # is whole. Left out: the one file of the vendored wasm-bindgen crate of
  # browser-tests that holds extern blocks, which no build that ships compiles
  # (ci/check-dep-info.sh fails a workspace crate that reads anything in that
  # tree), and the platform-FFI crates of the word rule's list.
  - id: extern_keyword-only-in-ffi-crates
    languages: [regex]
    severity: ERROR
    message: >-
      The keyword extern is written only in the platform-FFI crates
      (threat-model.md TM-7): an extern block links native code that can run
      before main, a macro of a crate on edition 2021 or earlier writes one
      without unsafe, and a macro can emit one from the keyword wherever it
      is written.
    paths:
      include:
        - "/crates/**"
        - "*.[Rr][Ss]"
        - "[Cc][Aa][Rr][Gg][Oo].[Tt][Oo][Mm][Ll]"
        - "/[Cc][Ll][Ii][Pp][Pp][Yy].[Tt][Oo][Mm][Ll]"
        - "/.[Cc][Ll][Ii][Pp][Pp][Yy].[Tt][Oo][Mm][Ll]"
        - "/fuzz/seeds/**"
        - "/.semgrep/tests/**"
      # The vendored crate's one file with extern blocks (ci/scope.py keeps
      # every crate from reading its tree), and the platform-FFI crates as in
      # the word rule's list (none yet), each "/crates/<name>/**".
      exclude: ["/browser-tests/webtransport/vendor/libp2p-webtransport-websys-0.6.0/src/bindings.rs"]
    pattern-regex: '\bextern\b'
  # TM-7: include! and the path attribute compile in another file, of any name
  # and from anywhere, beyond the reach of the rule above. So both are banned
  # in every file under crates/ but the manifests and in every Rust file, as
  # text that fails closed (a gap below is whitespace, characters beyond ASCII
  # or comments):
  # - the word include, whole or as include_<name> (include!, include_proto!,
  #   an alias in a use item, the name passed to a macro, prose too); only
  #   include_str! and include_bytes!, which read data, pass;
  # - path, a gap, then = but not == (#[path], #![path], a path in cfg_attr),
  #   but after a dot (a field) or after `let ` or `let mut ` (a binding);
  # - an attribute that starts with a metavariable (#[$) or is named path
  #   (#[path ...], #[r#path ...]), path followed by a metavariable, a $ inside
  #   cfg_attr(...) at any depth of parentheses, and a meta fragment
  #   ($x:meta) anywhere: each lets a macro build a path attribute from parts
  #   its callers pass.
  # A macro can still build one from tokens passed one at a time
  # (m!(#, path, =, "...")); ci/check-dep-info.sh catches the file it reads.
  # Allowed by their exact text: the two include!s of the protocol crate's
  # handshake harness, one copy for its test and for the fuzz target
  # handshake; the file they name is Rust, which the rule above scans.
  - id: other_files-only-as-data
    languages: [regex]
    severity: ERROR
    message: >-
      No include! and no path attribute, nor anything that could spell them
      (threat-model.md TM-7): either compiles in a file the rule
      unsafe_code-only-in-ffi-crates may not scan. Read data with include_str!
      or include_bytes!, and declare modules where they are.
    paths:
      include: ["/crates/**", "*.[Rr][Ss]", "/.semgrep/tests/**"]
      exclude: ["[Cc][Aa][Rr][Gg][Oo].[Tt][Oo][Mm][Ll]"]
    patterns:
      - pattern-either:
          - pattern-regex: '\binclude(?!_(?:str|bytes)\b)(?:_\w+)?\b'
          - pattern-regex: '(?<![.\w])(?<!\blet )(?<!\bmut )path(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*=(?!=)'
          - pattern-regex: '#(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*!?(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*\[(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*\$'
          - pattern-regex: '#(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*!?(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*\[(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*(?:r#)?path\b'
          - pattern-regex: '\bpath(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*\$'
          - pattern-regex: 'cfg_attr(?:\s|[^\x00-\x7f]|/\*[\s\S]*?\*/|//[^\n]*\n)*\((?:[^()]|(?<paren>\((?:[^()]|(?&paren))*\)))*\$'
          - pattern-regex: '(?<!#\[)\$\w+\s*:\s*meta\b'
      - pattern-not-regex: '\binclude!\("handshake_harness\.rs"\)'
      - pattern-not-regex: '\binclude!\("\.\./\.\./crates/protocol/src/vectors/handshake_harness\.rs"\)'
