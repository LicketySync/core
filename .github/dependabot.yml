# Version updates wait 7 days after a release (the owner's "Stay current" rule
# of 2026-10-25 in CLAUDE.md, against supply-chain attacks); cooldown does not
# apply to security updates, which come at once (GitHub's Dependabot options
# reference, "cooldown"). GitHub Actions are pinned by commit with the release
# tag in a comment, which Dependabot rewrites when it moves the pin
# (.github/workflows/ci.yml's header).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
