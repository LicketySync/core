# Every push to main, and the Dependabot pull requests (the only ones there are;
# decision 2026-10-14). The checks here are the ones the plan's Engineering practice
# table says run "every push"; nightly.yml, and the weekly mutants.yml and
# scorecard.yml, hold the rest.
#
# Pinning rule (the owner's decision of 2026-10-25, "CI tools - pin."): every
# action in every workflow, GitHub's own included, is pinned by full commit
# SHA, since a tag can be moved, and the comment after the pin names the
# release tag on that commit, which Dependabot reads to keep the pin current
# (release.yml and scorecard.yml state the same rule; ci/pinned-actions.sh,
# run below and by gate.sh, checks the form). Every tool a workflow installs
# is pinned to an exact version: gate.sh stops when a cargo tool it runs or
# reproduces, or typos, is installed in a workflow at any other version than
# the gate's, and CONTRIBUTING.md lists the pins Dependabot cannot see.
# dtolnay/rust-toolchain has one tag, v1, on its master branch, where
# `toolchain` has no default; its stable and nightly branches, used until
# 2026-10-25, are that commit with a default. The Rust toolchain itself
# floats: stable is rust-toolchain.toml's channel, which local builds and the
# gate follow too, and nightly (cargo-udeps here; fuzzing, cargo-careful and
# Miri in nightly.yml) is the `+nightly` of the day, as on the dev machine.
# Pinning either is a change of its own, to rust-toolchain.toml, gate.sh and
# bootstrap.sh with the workflows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Commits land on main directly, so a running push build is never cancelled by
  # the next push (a run still waiting to start can be superseded by it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests (nextest) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the daily target; Windows and macOS compile and test on every
        # change so the wiring never rots, per the plan's Packaging section.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # cargo-nextest, and in the jobs below cargo-llvm-cov and cargo-udeps, at
      # the exact versions gate.sh requires, with no fallback (see the note in
      # the deps job).
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - run: cargo test --workspace --doc

  coverage:
    name: coverage (cargo-llvm-cov, 90% on keys/protocol/index/engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.148
          fallback: none
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - name: Enforce 90% on each crate the plan names, and the index (same loop as gate.sh)
        run: |
          for c in keys protocol index engine; do
            others=$(ls crates | grep -vx "$c" | paste -sd'|' -)
            cargo llvm-cov nextest --all-features --fail-under-lines 90 \
              -p "licketysync-$c" --ignore-filename-regex "crates/($others)/"
          done
      # For the codecov job below, which alone uploads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

  # The coverage report to Codecov, authenticated by GitHub's OIDC token, so no
  # Codecov token is kept as a secret (owner approvals of 2026-10-23 and
  # 2026-10-25; the Codecov app is installed on the organization). A job of its
  # own, so that the id-token permission sits beside no build: the coverage job
  # runs every test and every dependency's build script with a read-only token.
  # Pushes to this repository's main only, so pull requests (Dependabot's among
  # them) and forks, a fork's own main included, never mint a token.
  #
  # The artifact came from the coverage job, which ran untrusted code, so it is
  # kept out of the checkout (a planted .git/config could run a command when
  # the CLI calls git) and checked to be one plain lcov.info under 64 MiB.
  # What is left: the CLI still parses lcov.info's content. Codecov's action
  # needs the repository checked out (its README says so) to map the report's
  # absolute paths onto the repository's files; the checkout keeps no
  # credentials. Inputs: files and disable_search, that one report and nothing
  # else; plugins: noop, no coverage tool of the CLI's runs; cleanup, the CLI
  # is downloaded into a temporary directory, not the checkout; disable_telem,
  # the CLI sends nothing to its error reporting; version, the CLI pinned (the
  # weekly Dependabot review checks it, CONTRIBUTING.md); fail_ci_if_error,
  # since without it the action's uploader script (dist/codecov.sh) only logs a
  # failed GPG signature or SHA-256 check of the CLI and runs it anyway. The
  # GPG key it checks against is still fetched at run time, from Keybase.
  # continue-on-error: a failure here, or a Codecov outage, shows on this job
  # and leaves the run green; codecov.yml makes Codecov's own commit statuses
  # informational for the same reason.
  codecov:
    name: Codecov upload (pushes to main, OIDC)
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'LicketySync/core'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov
          path: ${{ runner.temp }}/lcov
      - name: Check that the artifact is one plain lcov.info
        env:
          DIR: ${{ runner.temp }}/lcov
        run: |
          found=$(find "$DIR" -mindepth 1 -printf '%y %P\n')
          if [ "$found" != "f lcov.info" ]; then
            echo "expected one regular file, lcov.info, in the lcov artifact; found:" >&2
            printf '%s\n' "${found:-(nothing)}" >&2
            exit 1
          fi
          size=$(stat -c %s "$DIR/lcov.info")
          if [ "$size" -gt $((64 * 1024 * 1024)) ]; then
            echo "lcov.info is $size bytes, over the 64 MiB bound" >&2
            exit 1
          fi
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/lcov/lcov.info
          disable_search: true
          plugins: noop
          cleanup: true
          disable_telem: true
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true

  docs:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --document-private-items

  deps:
    name: cargo-deny, cargo-audit, cargo-machete, cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each tool at the exact version gate.sh requires (bootstrap.sh installs
      # them; gate.sh stops when this file or nightly.yml installs one any other
      # way), so that no new release changes what passes without a commit. A
      # bump is one reviewed change to ci.yml, nightly.yml, gate.sh and
      # bootstrap.sh. Dependabot cannot see these pins: each weekly Dependabot
      # review checks the four for new releases. `fallback: none` makes a
      # version missing from install-action's manifest fail here instead of
      # going to cargo-binstall, which can fetch an unverified binary and is
      # handed github.token.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-machete@0.9.2
          fallback: none
      # cargo-vet from crates.io: 0.10.1 and 0.10.2 have no release binaries, so
      # install-action's "latest" was 0.10.0, whose formatter rejects the
      # supply-chain/imports.lock that 0.10.2 writes (run 39160240196).
      - run: cargo install cargo-vet --version 0.10.2 --locked
      - run: cargo deny check
      - run: cargo deny --config deny-production.toml check bans
      - run: cargo audit
      - run: cargo machete
      - name: cargo vet (unaudited dependency changes)
        run: cargo vet --locked

  udeps:
    name: cargo-udeps (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-udeps@0.1.61
          fallback: none
      - run: cargo +nightly udeps --workspace --all-targets

  geiger:
    name: cargo-geiger (unsafe report; every count must equal ci/geiger-baseline.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Built with vendored OpenSSL so the tool never depends on the runner's OpenSSL
      # (decision 2026-10-14); bootstrap.sh installs it the same way. The version
      # is the one ci/geiger-baseline.txt names (counts differ between versions;
      # ci/geiger.sh checks it); its header says how to move to another.
      - run: cargo install cargo-geiger --version 0.14.0 --locked --features vendored-openssl
      # ci/geiger.sh prints the report, accepts cargo-geiger's exit 1 only for
      # warnings about files it cannot or need not scan, and fails when any of a
      # crate's five used unsafe counts differs from the baseline; gate.sh runs
      # the same two scripts.
      - run: ci/test-geiger.sh
      - run: ci/geiger.sh

  semgrep:
    name: Semgrep (community Rust rules + project rules)
    runs-on: ubuntu-latest
    container:
      # The version gate.sh's semgrep runs (bootstrap.sh installs it); a bump is
      # a reviewed change to both.
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The project rules' own cases first (.semgrep/tests/), so that a rule that
      # stopped matching fails here rather than passing the scan silently. gate.sh
      # runs both commands as they are here.
      - run: semgrep --test --metrics=off --config .semgrep/project.yml .semgrep/tests/project.rs
      # The cases are not findings, so the scan leaves .semgrep/ out. --timeout is
      # per rule and file (default 5 s), and --error does not fail on a timeout,
      # which skips that rule on that file: a review run saw the community
      # unsafe-usage rule time out at 5 s on two keys test modules (each scans in
      # under a second on the dev machine), so 60 s leaves a slow runner room.
      - run: semgrep scan --metrics=off --timeout 60 --config p/rust --config .semgrep --exclude .semgrep --error

  # typos at the version gate.sh requires: the action's release commit names
  # the typos it runs (action/entrypoint.sh downloads that release from
  # GitHub, with no checksum), and gate.sh stops unless the comment after the
  # pin names the same version. A Dependabot bump of this action moves gate.sh's
  # version and bootstrap.sh's with it (CONTRIBUTING.md).
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # The gitleaks command-line tool (MIT), not gitleaks-action: the action needs
  # a licence key for a repository an organization owns, free but issued on
  # registration at gitleaks.io and kept as a repository secret, and from v2 on
  # the action itself is no longer MIT-licensed. ci/gitleaks-install.sh pins
  # the release by version and SHA-256 and says how to move it (Dependabot
  # cannot see it); ci/gitleaks.sh holds the flags, .gitleaks.toml the
  # allowlists, .gitleaksignore the one ignored finding.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit of every branch, not only the ones this push brings.
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false
      - run: ci/gitleaks-install.sh "$RUNNER_TEMP/bin"
      # Prints rule, file, line and commit of each finding, never the value.
      - run: ci/gitleaks.sh history "$RUNNER_TEMP/bin/gitleaks"
      # The files as they are now, as gate.sh scans them: this also reads the
      # files git takes for binary (fuzz seeds among them), which the history
      # scan, reading `git log -p`, never sees.
      - run: ci/gitleaks.sh tree "$RUNNER_TEMP/bin/gitleaks"

  no-hostnames:
    name: no hostnames outside the allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ci/no-hostnames.sh is the check; gate.sh runs the same two scripts locally.
      - run: ci/test-no-hostnames.sh
      - run: ci/no-hostnames.sh

  # The pinning rule at the top of this file, checked in every workflow here;
  # gate.sh runs the same two scripts.
  pinned-actions:
    name: every action pinned by commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/test-pinned-actions.sh
      - run: ci/pinned-actions.sh

  # The scripts the scheduled workflows run (ci/mutants.sh in mutants.yml,
  # ci/fuzz-targets.sh in nightly.yml), tested on stand-ins for the tools on
  # every push, so that a change that breaks one fails here rather than at the
  # next scheduled run; and the line-ending attributes of the test vectors and
  # fuzz seeds, checked on Linux with Windows' core.autocrlf=true (the Windows
  # runner would check this script itself out with CRLF, which bash rejects).
  # gate.sh runs the same three.
  ci-scripts:
    name: tests of the mutants and fuzz-target scripts, and of .gitattributes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/test-mutants.sh
      - run: ci/test-fuzz-targets.sh
      - run: ci/test-vector-line-endings.sh
