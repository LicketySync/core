# Every push to main, and the Dependabot pull requests (the only ones there are;
# decision 2026-10-14). The checks here are the ones the plan's Engineering practice
# table says run "every push"; nightly.yml holds the rest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Commits land on main directly, so a running push build is never cancelled by
  # the next push (a run still waiting to start can be superseded by it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests (nextest) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the daily target; Windows and macOS compile and test on every
        # change so the wiring never rots, per the plan's Packaging section.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - run: cargo test --workspace --doc

  coverage:
    name: coverage (cargo-llvm-cov, 90% on key/protocol/engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - name: Enforce 90% on each crate the plan names (same loop as gate.sh)
        run: |
          for c in keys protocol engine; do
            others=$(ls crates | grep -vx "$c" | paste -sd'|' -)
            cargo llvm-cov nextest --all-features --fail-under-lines 90 \
              -p "licketysync-$c" --ignore-filename-regex "crates/($others)/"
          done
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  docs:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  deps:
    name: cargo-deny, cargo-audit, cargo-machete, cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-machete,cargo-vet
      - run: cargo deny check
      - run: cargo deny --config deny-production.toml check bans
      - run: cargo audit
      - run: cargo machete
      - name: cargo vet (unaudited dependency changes)
        run: cargo vet --locked

  udeps:
    name: cargo-udeps (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets

  geiger:
    name: cargo-geiger (unsafe report; every count must equal ci/geiger-baseline.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built with vendored OpenSSL so the tool never depends on the runner's OpenSSL
      # (decision 2026-10-14); bootstrap.sh installs it the same way. The version
      # is the one ci/geiger-baseline.txt names (counts differ between versions;
      # ci/geiger.sh checks it); its header says how to move to another.
      - run: cargo install cargo-geiger --version 0.14.0 --locked --features vendored-openssl
      # ci/geiger.sh prints the report, accepts cargo-geiger's exit 1 only for
      # warnings about files it cannot or need not scan, and fails when any of a
      # crate's five used unsafe counts differs from the baseline; gate.sh runs
      # the same two scripts.
      - run: ci/test-geiger.sh
      - run: ci/geiger.sh

  semgrep:
    name: Semgrep (community Rust rules + project rules)
    runs-on: ubuntu-latest
    container:
      # The version gate.sh's semgrep runs (bootstrap.sh installs it); a bump is
      # a reviewed change to both.
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@v4
      # The project rules' own cases first (.semgrep/tests/), so that a rule that
      # stopped matching fails here rather than passing the scan silently. gate.sh
      # runs both commands as they are here.
      - run: semgrep --test --metrics=off --config .semgrep/project.yml .semgrep/tests/project.rs
      # The cases are not findings, so the scan leaves .semgrep/ out. --timeout is
      # per rule and file (default 5 s), and --error does not fail on a timeout,
      # which skips that rule on that file: a review run saw the community
      # unsafe-usage rule time out at 5 s on two keys test modules (each scans in
      # under a second on the dev machine), so 60 s leaves a slow runner room.
      - run: semgrep scan --metrics=off --timeout 60 --config p/rust --config .semgrep --exclude .semgrep --error

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  # The gitleaks command-line tool (MIT), not gitleaks-action: the action needs
  # a licence key for a repository an organization owns, free but issued on
  # registration at gitleaks.io and kept as a repository secret, and from v2 on
  # the action itself is no longer MIT-licensed. ci/gitleaks-install.sh pins
  # the release by version and SHA-256 and says how to move it (Dependabot
  # cannot see it); ci/gitleaks.sh holds the flags, .gitleaks.toml the one
  # allowlist.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit of every branch, not only the ones this push brings.
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false
      - run: ci/gitleaks-install.sh "$RUNNER_TEMP/bin"
      # Prints rule, file, line and commit of each finding, never the value.
      - run: ci/gitleaks.sh history "$RUNNER_TEMP/bin/gitleaks"

  no-hostnames:
    name: no hostnames outside the allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ci/no-hostnames.sh is the check; gate.sh runs the same two scripts locally.
      - run: ci/test-no-hostnames.sh
      - run: ci/no-hostnames.sh

  no-test-vectors:
    name: no test-vectors feature outside dev-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ci/no-test-vectors.sh is the check; gate.sh runs the same two scripts locally.
      - run: ci/test-no-test-vectors.sh
      - run: ci/no-test-vectors.sh
