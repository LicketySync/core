# Every push to main, and the Dependabot pull requests (the only ones there are;
# decision 2026-10-14). The checks here are the ones the plan's Engineering practice
# table says run "every push"; nightly.yml holds the rest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Commits land on main directly, so a running push build is never cancelled by
  # the next push (a run still waiting to start can be superseded by it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests (nextest) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the daily target; Windows and macOS compile and test on every
        # change so the wiring never rots, per the plan's Packaging section.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - run: cargo test --workspace --doc

  coverage:
    name: coverage (cargo-llvm-cov, 90% on key/protocol/engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - name: Enforce 90% on each crate the plan names (same loop as gate.sh)
        run: |
          for c in keys protocol engine; do
            others=$(ls crates | grep -vx "$c" | paste -sd'|' -)
            cargo llvm-cov nextest --all-features --fail-under-lines 90 \
              -p "licketysync-$c" --ignore-filename-regex "crates/($others)/"
          done
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  docs:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  deps:
    name: cargo-deny, cargo-audit, cargo-machete, cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-machete,cargo-vet
      - run: cargo deny check
      - run: cargo audit
      - run: cargo machete
      - name: cargo vet (unaudited dependency changes)
        run: cargo vet --locked

  udeps:
    name: cargo-udeps (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets

  geiger:
    name: cargo-geiger (unsafe report; first-party unsafe is forbidden by the workspace lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built with vendored OpenSSL so the tool never depends on the runner's OpenSSL
      # (decision 2026-10-14); bootstrap.sh builds it the same way locally.
      - run: cargo install cargo-geiger --locked --features vendored-openssl
      # cargo-geiger has no --workspace flag, refuses the virtual workspace manifest
      # and rejects relative paths, so it runs once per crate with an absolute path.
      - name: cargo geiger, one crate at a time
        run: |
          for manifest in crates/*/Cargo.toml; do
            cargo geiger --manifest-path "$PWD/$manifest" --output-format Ascii
          done

  semgrep:
    name: Semgrep (community Rust rules + project rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/rust --config .semgrep --error

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-hostnames:
    name: no hostnames outside the allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ci/no-hostnames.sh is the check; gate.sh runs the same two scripts locally.
      - run: ci/test-no-hostnames.sh
      - run: ci/no-hostnames.sh
