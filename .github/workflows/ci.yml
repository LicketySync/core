# Every push to main, and the Dependabot pull requests (the only ones there are;
# decision 2026-10-14). The checks here are the ones the plan's Engineering practice
# table says run "every push"; nightly.yml, and the weekly mutants.yml and
# scorecard.yml, hold the rest.
#
# Pinning rule (the owner's decisions of 2026-10-25, "CI tools - pin." and
# "Stay current", in CLAUDE.md): every action in every workflow of core, site
# and web, GitHub's own included, is pinned by full commit SHA, since a tag can
# be moved, with a comment after the pin naming the release tag on that commit,
# which Dependabot rewrites when it moves the pin (ci/pinned-actions.sh, run
# below and by gate.sh, checks the form). Every tool and Rust toolchain a
# workflow installs is pinned to an exact version, written once, in
# ci/pins.env: each copy in a workflow is that key's value, and gate.sh stops
# when one differs. A pin is the newest release that has been out for at least
# 7 days, or a newer one at once when it fixes a critical or high
# vulnerability; Dependabot waits the same 7 days (.github/dependabot.yml),
# except for security updates, and the weekly refresh moves what it cannot see
# (CONTRIBUTING.md, "Pins and the weekly refresh").
#
# dtolnay/rust-toolchain has one tag, v1, on its master branch, where
# `toolchain` has no default; its stable and nightly branches, used until
# 2026-10-25, are that commit with a default. Each step installs RUST_STABLE,
# or RUST_NIGHTLY in the jobs that need nightly (cargo-udeps here; fuzzing,
# cargo-careful and Miri in nightly.yml), and RUSTUP_TOOLCHAIN, set for the
# workflow below and again in each nightly job, names the same. RUSTUP_TOOLCHAIN
# is what pins the toolchain: rust-toolchain.toml's `channel = "stable"`
# outranks the default that rust-toolchain sets, so without it every cargo
# command in the checkout would run the runner's stable of the day.
# rust-toolchain.toml stays on stable, so that the dev machine needs no
# separately named toolchain; gate.sh stops unless that stable is RUST_STABLE
# and RUST_NIGHTLY is installed, and ci/toolchains.sh (run below and by gate.sh)
# checks every workflow. Two toolchains are not ours to pin: CodeQL's Rust
# extractor sets RUSTUP_TOOLCHAIN itself, to the release its CodeQL bundle names
# (the pinned codeql-action's default bundle, so it moves only with that pin),
# and ClusterFuzzLite builds in its own image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Commits land on main directly, so a running push build is never cancelled by
  # the next push (a run still waiting to start can be superseded by it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # RUST_STABLE (the note at the top); the udeps job sets RUST_NIGHTLY.
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests (nextest) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the daily target; Windows and macOS compile and test on every
        # change so the wiring never rots, per the plan's Packaging section.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # cargo-nextest, and in the jobs below cargo-llvm-cov and cargo-udeps, at
      # their ci/pins.env versions, with no fallback (see the note in the deps
      # job).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - run: cargo test --workspace --doc

  coverage:
    name: coverage (cargo-llvm-cov, 90% on keys/protocol/index/engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.148
          fallback: none
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - name: Enforce 90% on each crate the plan names, and the index (same loop as gate.sh)
        run: |
          for c in keys protocol index engine; do
            others=$(ls crates | grep -vx "$c" | paste -sd'|' -)
            cargo llvm-cov nextest --all-features --fail-under-lines 90 \
              -p "licketysync-$c" --ignore-filename-regex "crates/($others)/"
          done
      # For the codecov job below, which alone uploads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

  # The coverage report to Codecov, authenticated by GitHub's OIDC token, so no
  # Codecov token is kept as a secret (owner approvals of 2026-10-23 and
  # 2026-10-25; the Codecov app is installed on the organization). A job of its
  # own, so that the id-token permission sits beside no build: the coverage job
  # runs every test and every dependency's build script with a read-only token.
  # Pushes to this repository's main only, so pull requests (Dependabot's among
  # them) and forks, a fork's own main included, never mint a token.
  #
  # The artifact came from the coverage job, which ran untrusted code, so it is
  # kept out of the checkout (a planted .git/config could run a command when
  # the CLI calls git) and checked to be one plain lcov.info under 64 MiB.
  # What is left: the CLI still parses lcov.info's content. Codecov's action
  # needs the repository checked out (its README says so) to map the report's
  # absolute paths onto the repository's files; the checkout keeps no
  # credentials. Inputs: files and disable_search, that one report and nothing
  # else; plugins: noop, no coverage tool of the CLI's runs; cleanup, the CLI
  # is downloaded into a temporary directory, not the checkout; disable_telem,
  # the CLI sends nothing to its error reporting; version, the CLI pinned
  # (CODECOV_CLI in ci/pins.env; the weekly refresh moves it); fail_ci_if_error,
  # since without it the action's uploader script (dist/codecov.sh) only logs a
  # failed GPG signature or SHA-256 check of the CLI and runs it anyway. The
  # GPG key it checks against is still fetched at run time, from Keybase.
  # continue-on-error: a failure here, or a Codecov outage, shows on this job
  # and leaves the run green; codecov.yml makes Codecov's own commit statuses
  # informational for the same reason.
  codecov:
    name: Codecov upload (pushes to main, OIDC)
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'LicketySync/core'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov
          path: ${{ runner.temp }}/lcov
      - name: Check that the artifact is one plain lcov.info
        env:
          DIR: ${{ runner.temp }}/lcov
        run: |
          found=$(find "$DIR" -mindepth 1 -printf '%y %P\n')
          if [ "$found" != "f lcov.info" ]; then
            echo "expected one regular file, lcov.info, in the lcov artifact; found:" >&2
            printf '%s\n' "${found:-(nothing)}" >&2
            exit 1
          fi
          size=$(stat -c %s "$DIR/lcov.info")
          if [ "$size" -gt $((64 * 1024 * 1024)) ]; then
            echo "lcov.info is $size bytes, over the 64 MiB bound" >&2
            exit 1
          fi
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/lcov/lcov.info
          disable_search: true
          plugins: noop
          cleanup: true
          disable_telem: true
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true

  docs:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --document-private-items

  deps:
    name: cargo-deny, cargo-audit, cargo-machete, cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Each tool at its ci/pins.env version, which gate.sh requires too (it
      # stops when a workflow installs one any other way), so that no new
      # release changes what passes without a commit. Dependabot cannot see
      # these pins; the weekly refresh moves them (CONTRIBUTING.md).
      # `fallback: none` makes a version missing from install-action's manifest
      # fail here instead of going to cargo-binstall, which can fetch an
      # unverified binary and is handed github.token.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-machete@0.9.2
          fallback: none
      # cargo-vet from crates.io, since not every release has release binaries:
      # install-action once fell back to an older one, whose formatter rejected
      # the supply-chain/imports.lock that the pinned one writes (run
      # 39160240196).
      - run: cargo install cargo-vet --version 0.10.2 --locked
      - run: cargo deny check
      - run: cargo deny --config deny-production.toml check bans
      - run: cargo audit
      - run: cargo machete
      - name: cargo vet (unaudited dependency changes)
        run: cargo vet --locked
      # fuzz/Cargo.lock, which nightly.yml's fuzz jobs build from, is current.
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml

  udeps:
    name: cargo-udeps (nightly)
    runs-on: ubuntu-latest
    # RUST_NIGHTLY, for every cargo and rustc call in this job (the note at the
    # top); the command names it too, as gate.sh's does.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-udeps@0.1.61
          fallback: none
      - run: cargo +nightly-2026-10-18 udeps --workspace --all-targets

  geiger:
    name: cargo-geiger (unsafe report; every count must equal ci/geiger-baseline.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Built with vendored OpenSSL so the tool never depends on the runner's OpenSSL
      # (decision 2026-10-14); bootstrap.sh installs it the same way. The version
      # is CARGO_GEIGER (ci/pins.env), which ci/geiger-baseline.txt names too,
      # since counts differ between versions (ci/geiger.sh checks it); the
      # baseline's header says how to move to another.
      - run: cargo install cargo-geiger --version 0.14.0 --locked --features vendored-openssl
      # ci/geiger.sh prints the report, accepts cargo-geiger's exit 1 only for
      # warnings about files it cannot or need not scan, and fails when any of a
      # crate's five used unsafe counts differs from the baseline; gate.sh runs
      # the same two scripts.
      - run: ci/test-geiger.sh
      - run: ci/geiger.sh

  semgrep:
    name: Semgrep (community Rust rules + project rules)
    runs-on: ubuntu-latest
    container:
      # SEMGREP by SEMGREP_IMAGE_DIGEST (ci/pins.env), so that a re-pushed tag
      # changes nothing; gate.sh runs the same semgrep (bootstrap.sh installs it).
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The project rules' own cases first (.semgrep/tests/), so that a rule that
      # stopped matching fails here rather than passing the scan silently. gate.sh
      # runs both commands as they are here.
      - run: semgrep --test --metrics=off --config .semgrep/project.yml .semgrep/tests/project.rs
      # The cases are not findings, so the scan leaves .semgrep/ out. --timeout is
      # per rule and file (default 5 s), and --error does not fail on a timeout,
      # which skips that rule on that file: a review run saw the community
      # unsafe-usage rule time out at 5 s on two keys test modules (each scans in
      # under a second on the dev machine), so 60 s leaves a slow runner room.
      - run: semgrep scan --metrics=off --timeout 60 --config p/rust --config .semgrep --exclude .semgrep --error

  # typos at TYPOS (ci/pins.env), the version gate.sh runs, installed by
  # install-action, which checks the archive's SHA-256 against its manifest,
  # with no fallback (see the note in the deps job).
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: typos@1.51.1
          fallback: none
      - run: typos

  # The gitleaks command-line tool (MIT), not gitleaks-action: the action needs
  # a licence key for a repository an organization owns, free but issued on
  # registration at gitleaks.io and kept as a repository secret, and from v2 on
  # the action itself is no longer MIT-licensed. ci/gitleaks-install.sh
  # installs GITLEAKS (ci/pins.env) after checking its SHA-256 and says how to
  # move it (Dependabot cannot see it); ci/gitleaks.sh holds the flags,
  # .gitleaks.toml the allowlists, .gitleaksignore the one ignored finding.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit of every branch, not only the ones this push brings.
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false
      - run: ci/gitleaks-install.sh "$RUNNER_TEMP/bin"
      # Prints rule, file, line and commit of each finding, never the value.
      - run: ci/gitleaks.sh history "$RUNNER_TEMP/bin/gitleaks"
      # The files as they are now, as gate.sh scans them: this also reads the
      # files git takes for binary (fuzz seeds among them), which the history
      # scan, reading `git log -p`, never sees.
      - run: ci/gitleaks.sh tree "$RUNNER_TEMP/bin/gitleaks"

  no-hostnames:
    name: no hostnames outside the allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ci/no-hostnames.sh is the check; gate.sh runs the same two scripts locally.
      - run: ci/test-no-hostnames.sh
      - run: ci/no-hostnames.sh

  # The action half of the pinning rule at the top of this file, checked in
  # every workflow here; gate.sh runs the same two scripts.
  pinned-actions:
    name: every action pinned by commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/test-pinned-actions.sh
      - run: ci/pinned-actions.sh

  # The scripts the scheduled workflows run (ci/mutants.sh in mutants.yml,
  # ci/fuzz-targets.sh in nightly.yml), tested on stand-ins for the tools on
  # every push, so that a change that breaks one fails here rather than at the
  # next scheduled run; the line-ending attributes of the test vectors and
  # fuzz seeds, checked on Linux with Windows' core.autocrlf=true (the Windows
  # runner would check this script itself out with CRLF, which bash rejects);
  # and the toolchain half of the pinning rule, ci/toolchains.sh with its
  # tests. gate.sh runs the same.
  ci-scripts:
    name: tests of the mutants and fuzz-target scripts and .gitattributes; the toolchain check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/test-mutants.sh
      - run: ci/test-fuzz-targets.sh
      - run: ci/test-vector-line-endings.sh
      - run: ci/test-toolchains.sh
      - run: ci/toolchains.sh
