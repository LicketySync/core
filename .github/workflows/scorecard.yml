# OpenSSF Scorecard, weekly as the plan's checks table says (the score is shown
# on the Contribute page); also on demand. Its results are published
# (publish_results), which holds this whole file to Scorecard's rules, or the
# action fails; hence a workflow of its own. No top-level env or defaults and
# no write permission at the top; no job but this one with id-token: write (the
# OIDC token that proves where the results come from); and this job on an
# Ubuntu runner with no env, defaults, container or services, every step one of
# the actions Scorecard approves (checkout, upload-artifact,
# codeql-action/upload-sarif, scorecard-action, harden-runner), so never a
# `run:` step. Scheduled runs are supported on the default branch only;
# workflow_dispatch is, in Scorecard's words, experimental.
#
# Pinning rule (the owner's decisions of 2026-10-25; in full in ci.yml's
# header): every action pins by full commit SHA, GitHub's own included, since a
# tag can be moved, with the release tag on that commit in a comment, which
# Dependabot rewrites when it moves the pin.
# Scorecard matches its approved actions by name, and its own published
# workflow pins them by commit too. The action runs the container image
# docker://ghcr.io/ossf/scorecard-action:v2.5.0, which its pinned commit names
# by tag; Scorecard approves actions by name, so the image cannot be pinned
# here (a residual). upload-sarif is v4, whose inputs are v3's (v3 is
# deprecated in December 2026, in codeql-action's changelog).
name: Scorecard

on:
  schedule:
    - cron: "47 13 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # v2.5.0 because v2.4.0 pulls its image from gcr.io, which now refuses it:
  # the job failed in 18 s every night (runs 39576345810, 39755196041). v2.5.0
  # pulls ghcr.io/ossf/scorecard-action. security-events: write is for the
  # SARIF upload.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
