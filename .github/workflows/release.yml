# Releases: built in CI, auditable, with an SBOM and build provenance, signed.
# Linux and the Chrome client are published first; other targets compile unsigned
# until the signing accounts exist (plan: Packaging).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-cyclonedx
      - run: cargo auditable build --release --locked --target ${{ matrix.target }} --package licketysync-cli
      - run: cargo cyclonedx --format json --all
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/${{ matrix.target }}/release/licketysync
      - uses: actions/upload-artifact@v7
        with:
          name: licketysync-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/licketysync
            **/*.cdx.json
