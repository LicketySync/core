# ClusterFuzzLite: fuzzing of what each push changed, until OSS-Fuzz accepts the
# project. Manual only for now: the build action needs .clusterfuzzlite/project.yaml,
# Dockerfile and build.sh, which do not exist yet. Switch "on:" to
# "push: branches: [main]" in the change that adds them with the first real decoder
# (there are no pull requests, decision 2026-10-14; code-change mode handles pushes).
name: ClusterFuzzLite

on:
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
