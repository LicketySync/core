# GitHub code scanning with CodeQL's Rust analysis. Free for public repositories.
# Every action pinned by commit (the pinning rule in ci.yml). codeql-action is
# v4: v3 is deprecated in December 2026 (codeql-action's changelog), and the
# action.yml of init and of analyze declare the same inputs at v3.39.1 and
# v4.39.1, only their runtime moving from Node 20 to Node 24.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
