# The slow checks the plan's checks table runs nightly: fuzzing, Miri,
# cargo-careful, the long simulator runs, spike B's WebTransport check in
# headless Chrome, and the daily advisory feed
# (cargo-audit against the lockfile, TM-8 and TM-22: a vulnerability published
# after a crate was added is caught without a code change). Nightly on main;
# also on demand. The weekly ones are mutants.yml and scorecard.yml.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# RUST_STABLE (ci/pins.env; ci.yml's header says why RUSTUP_TOOLCHAIN) for
# every job, and RUST_NIGHTLY for the three jobs that set it again.
env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  audit:
    name: cargo-audit (daily advisory feed, TM-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      # The version ci.yml's deps job pins and gate.sh checks, with no fallback
      # (see the note there).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit
      # fuzz/ and browser-tests/webtransport are workspaces of their own, with
      # their own lockfiles.
      - run: cargo audit --file fuzz/Cargo.lock
      - run: cargo audit --file browser-tests/webtransport/Cargo.lock

  # One job per fuzz target, so that 30 minutes each fits GitHub's 6 h job
  # limit however many decoders there are. cargo-fuzz from crates.io:
  # install-action has no cargo-fuzz (its `cargo-fuzz` ref is a branch whose
  # action installs nothing), so until 2026-10-22 the job ran without it, and
  # `for t in $(cargo fuzz list)` hid the error: it passed in 17 s and fuzzed
  # nothing (runs 39576345810, 39755196041). gate.sh checks this version.
  fuzz-targets:
    name: cargo-fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # cargo-fuzz has no --locked: this fails when fuzz/Cargo.lock is not
      # current, so that the fuzz jobs build from exactly it.
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: ci/test-fuzz-targets.sh
      # Fails when cargo fuzz list fails; with no target, prints a notice, and
      # the fuzz jobs below are skipped.
      - id: list
        run: ci/fuzz-targets.sh "$GITHUB_OUTPUT"

  fuzz:
    name: cargo-fuzz ${{ matrix.target }} (30 minutes)
    needs: fuzz-targets
    if: needs.fuzz-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-27
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # As in the job above: the build below then uses fuzz/Cargo.lock as it is.
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      # RUST_NIGHTLY, named in the command too: the sanitizer flags need
      # nightly. The first corpus directory takes what libFuzzer
      # finds; the second, fuzz/seeds/<target>, holds the committed seeds made
      # from the vectors.
      - name: Fuzz for 30 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd fuzz
          mkdir -p "corpus/$TARGET" "seeds/$TARGET"
          cargo +nightly-2026-10-27 fuzz run "$TARGET" "$PWD/corpus/$TARGET" "$PWD/seeds/$TARGET" -- -max_total_time=1800
      # The input that crashed, to reproduce with `cargo +<RUST_NIGHTLY> fuzz
      # run <target> <file>`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  careful:
    name: cargo-careful (runtime UB checks)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-27
          components: rust-src
      # The version gate.sh checks, with no fallback (see the note in ci.yml's
      # deps job).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-careful@0.4.10
          fallback: none
      - run: cargo +nightly-2026-10-27 careful test --workspace

  miri:
    name: Miri (FFI crates only, when they exist)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-27
          components: miri
      - run: echo "No FFI crate yet; Miri runs on crates that opt out of forbid(unsafe_code)."

  sim-long:
    name: simulator, long seeded runs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every shipped scenario over 20,000 seeds (well under a second per
      # thousand with the toy peer; about 20 s per thousand, some 6 minutes
      # in all, for `contract`), `contract` included: its probing peers check
      # the runtime's per-side promises from the inside, and a seed where one
      # breaks fails like a seed that does not converge. The binary
      # stops at the first such seed and prints it with the last events, which
      # is all that is needed to replay the run locally with the same
      # arguments. `broken` is the deliberately failing scenario that checks
      # the reporting. The `engine-*` scenarios, the phase 0 gate's, run the
      # real engine: engine-late-joiner for 100 seeds, every other one for
      # 300. Measured in release on the development machine, idle, one seed
      # takes 4.3 s for engine-late-joiner, 1.3 s for engine-clean, 1.1 s for
      # engine-pacing and 1.2 s for the other fourteen together, so these
      # counts come to about 25 minutes there (the reviewers measured about
      # twice that under load). That leaves a margin against the 60 of this
      # job's 120 minutes the engine brief allows them, on a runner not yet
      # measured. `engine-drops-stress` is left out: a stress run that not
      # every seed passes, its pass rate reported by hand.
      - name: Every scenario, seeds 0 to 19999 (engine scenarios 0 to 299 or 99)
        run: |
          set -euo pipefail
          cargo build --release -p licketysync-sim
          scenarios=$(target/release/licketysync-sim list | awk '{print $1}' | grep -vx -e broken -e engine-drops-stress)
          for s in $scenarios; do
            case "$s" in
              engine-late-joiner) target/release/licketysync-sim "$s" 0 100 ;;
              engine-*) target/release/licketysync-sim "$s" 0 300 ;;
              *) target/release/licketysync-sim "$s" 0 20000 ;;
            esac
          done

  # Spike B's check (pass condition B2), nightly because Chrome and the pins
  # move (owner decision 2 of the spike brief): net's WebTransport listeners
  # (feature webtransport) on 127.0.0.1, dialed from headless Chrome by
  # browser-tests/webtransport with only an address and a certificate hash;
  # then ci/check-netlog.py reads Chrome's net log for the outer key exchange
  # (X25519MLKEM768, TM-33) and for any packet that left loopback. Chrome for
  # Testing and its chromedriver at CHROME_FOR_TESTING, each zip checked
  # against its SHA-256 in ci/pins.env by ci/chrome-install.sh, not the
  # runner's Chrome, which moves with the image; wasm-bindgen-cli at
  # WASM_BINDGEN_CLI from crates.io, the version the test crate's
  # wasm-bindgen pins (gate.sh checks both copies).
  webtransport-chrome:
    name: WebTransport from headless Chrome (spike B)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: ci/chrome-install.sh "$RUNNER_TEMP/chrome"
      - name: The WebTransport tests in headless Chrome, and the net-log check
        env:
          CHROME: ${{ runner.temp }}/chrome/chrome-linux64/chrome
          CHROMEDRIVER: ${{ runner.temp }}/chrome/chromedriver-linux64/chromedriver
          OUT: ${{ runner.temp }}/webtransport-chrome
        run: ci/webtransport-chrome.sh
      # The listener's and the browser's logs and Chrome's net log, to read a
      # failure, or the negotiated group, by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webtransport-chrome
          path: |
            ${{ runner.temp }}/webtransport-chrome/*.log
            ${{ runner.temp }}/webtransport-chrome/netlog.json
          if-no-files-found: ignore
          retention-days: 14
