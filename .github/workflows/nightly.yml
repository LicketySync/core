# The slow checks: fuzzing, mutation testing, Miri, cargo-careful, the long
# simulator runs, and the daily advisory feed (cargo-audit against the lockfile,
# TM-8 and TM-22: a vulnerability published after a crate was added is caught
# without a code change). Nightly on main; also on demand.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit (daily advisory feed, TM-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  fuzz:
    name: cargo-fuzz (every decoder, 30 minutes each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Run each target
        run: |
          set -euo pipefail
          cd fuzz
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=1800
          done

  mutants:
    name: cargo-mutants (keys, protocol, engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      - run: cargo mutants --package licketysync-keys --package licketysync-protocol --package licketysync-engine --timeout 300 --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: mutants.out

  careful:
    name: cargo-careful (runtime UB checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo install cargo-careful --locked
      - run: cargo +nightly careful test --workspace

  miri:
    name: Miri (FFI crates only, when they exist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: echo "No FFI crate yet; Miri runs on crates that opt out of forbid(unsafe_code)."

  sim-long:
    name: simulator, long seeded runs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every shipped scenario over 20,000 seeds (about a second per thousand
      # with the toy peer), `contract` included: its probing peers check the
      # runtime's ordering and connection promises from the inside, and a seed
      # where one breaks fails like a seed that does not converge. The binary
      # stops at the first such seed and prints it with the last events, which
      # is all that is needed to replay the run locally with the same
      # arguments. `broken` is the deliberately failing scenario that checks
      # the reporting.
      - name: Every scenario, seeds 0 to 19999
        run: |
          set -euo pipefail
          cargo build --release -p licketysync-sim
          scenarios=$(target/release/licketysync-sim list | awk '{print $1}' | grep -vx broken)
          for s in $scenarios; do
            target/release/licketysync-sim "$s" 0 20000
          done

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
