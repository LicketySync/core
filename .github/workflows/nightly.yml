# The slow checks the plan's checks table runs nightly: fuzzing, Miri,
# cargo-careful, the long simulator runs, and the daily advisory feed
# (cargo-audit against the lockfile, TM-8 and TM-22: a vulnerability published
# after a crate was added is caught without a code change). Nightly on main;
# also on demand. The weekly ones are mutants.yml and scorecard.yml.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# RUST_STABLE (ci/pins.env; ci.yml's header says why RUSTUP_TOOLCHAIN) for
# every job, and RUST_NIGHTLY for the three jobs that set it again.
env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  audit:
    name: cargo-audit (daily advisory feed, TM-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      # The version ci.yml's deps job pins and gate.sh checks, with no fallback
      # (see the note there).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit
      # fuzz/ is a workspace of its own, with its own lockfile.
      - run: cargo audit --file fuzz/Cargo.lock

  # One job per fuzz target, so that 30 minutes each fits GitHub's 6 h job
  # limit however many decoders there are. cargo-fuzz from crates.io:
  # install-action has no cargo-fuzz (its `cargo-fuzz` ref is a branch whose
  # action installs nothing), so until 2026-10-22 the job ran without it, and
  # `for t in $(cargo fuzz list)` hid the error: it passed in 17 s and fuzzed
  # nothing (runs 39576345810, 39755196041). gate.sh checks this version.
  fuzz-targets:
    name: cargo-fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # cargo-fuzz has no --locked: this fails when fuzz/Cargo.lock is not
      # current, so that the fuzz jobs build from exactly it.
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: ci/test-fuzz-targets.sh
      # Fails when cargo fuzz list fails; with no target, prints a notice, and
      # the fuzz jobs below are skipped.
      - id: list
        run: ci/fuzz-targets.sh "$GITHUB_OUTPUT"

  fuzz:
    name: cargo-fuzz ${{ matrix.target }} (30 minutes)
    needs: fuzz-targets
    if: needs.fuzz-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-18
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # As in the job above: the build below then uses fuzz/Cargo.lock as it is.
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      # RUST_NIGHTLY, named in the command too: the sanitizer flags need
      # nightly. The first corpus directory takes what libFuzzer
      # finds; the second, fuzz/seeds/<target>, holds the committed seeds made
      # from the vectors.
      - name: Fuzz for 30 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd fuzz
          mkdir -p "corpus/$TARGET" "seeds/$TARGET"
          cargo +nightly-2026-10-18 fuzz run "$TARGET" "$PWD/corpus/$TARGET" "$PWD/seeds/$TARGET" -- -max_total_time=1800
      # The input that crashed, to reproduce with `cargo +<RUST_NIGHTLY> fuzz
      # run <target> <file>`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  careful:
    name: cargo-careful (runtime UB checks)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-18
          components: rust-src
      # The version gate.sh checks, with no fallback (see the note in ci.yml's
      # deps job).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-careful@0.4.10
          fallback: none
      - run: cargo +nightly-2026-10-18 careful test --workspace

  miri:
    name: Miri (FFI crates only, when they exist)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-18
          components: miri
      - run: echo "No FFI crate yet; Miri runs on crates that opt out of forbid(unsafe_code)."

  sim-long:
    name: simulator, long seeded runs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Every shipped scenario over 20,000 seeds (well under a second per
      # thousand with the toy peer; about 20 s per thousand, some 6 minutes
      # in all, for `contract`), `contract` included: its probing peers check
      # the runtime's per-side promises from the inside, and a seed where one
      # breaks fails like a seed that does not converge. The binary
      # stops at the first such seed and prints it with the last events, which
      # is all that is needed to replay the run locally with the same
      # arguments. `broken` is the deliberately failing scenario that checks
      # the reporting.
      - name: Every scenario, seeds 0 to 19999
        run: |
          set -euo pipefail
          cargo build --release -p licketysync-sim
          scenarios=$(target/release/licketysync-sim list | awk '{print $1}' | grep -vx broken)
          for s in $scenarios; do
            target/release/licketysync-sim "$s" 0 20000
          done
